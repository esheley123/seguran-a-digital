<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Segurança Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>🔐 Segurança Digital</h1>
            <p>Projeto de Segurança e Criptografia - 3º Ano Ensino Médio</p>
        </header>

        <!-- Seção 1: Analisador -->
        <section class="card">
            <h2>Testar Força da Senha</h2>
            <div class="input-group">
                <input type="password" id="password-input" placeholder="Digite uma senha...">
                <button onclick="analisarSenha()">Analisar</button>
            </div>
            <div id="analise-resultado" class="resultado hidden">
                <p>Status: <strong id="status-senha">-</strong></p>
                <ul class="lista-requisitos">
                    <li id="req-comprimento">Mínimo de 12 caracteres</li>
                    <li id="req-maiuscula">Letra maiúscula</li>
                    <li id="req-numero">Número</li>
                    <li id="req-especial">Caractere especial</li>
                </ul>
            </div>
        </section>

        <!-- Seção 2: Gerador -->
        <section class="card">
            <h2>Gerador de Senha Segura</h2>
            <div class="input-group">
                <input type="number" id="length-input" value="16" min="12" max="32">
                <button onclick="gerarSenha()">Gerar</button>
            </div>
            <div id="gerador-resultado" class="resultado hidden">
                <p>Sua senha gerada:</p>
                <div class="senha-box">
                    <span id="senha-gerada"></span>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
